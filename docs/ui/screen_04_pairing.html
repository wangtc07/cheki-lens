<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChekiLens - 04. ペアリングワークベンチ (iOS 18 Sheet Style)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; -webkit-font-smoothing: antialiased; }
  body { background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  
  .iphone {
    width: 393px; height: 852px; background: #000000; border-radius: 54px;
    box-shadow: 0 0 0 2px #262626, 0 25px 70px rgba(0,0,0,0.9); position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  /* Sheet Header */
  .sheet-header {
    height: 56px; padding: 16px 18px 0; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 0.5px solid rgba(84,84,88,0.4);
  }
  .sheet-title { color: #fff; font-size: 17px; font-weight: 700; }
  .sheet-btn-cancel { color: #0A84FF; font-size: 16px; cursor: pointer; }
  .sheet-btn-done { color: #0A84FF; font-size: 16px; font-weight: 700; cursor: pointer; }

  /* Segmented Control */
  .segment-wrap { padding: 14px 16px; }
  .segment-pill-bg { background: #1C1C1E; border-radius: 20px; display: flex; padding: 3px; height: 38px; }
  .segment-item { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: rgba(235,235,245,0.6); border-radius: 17px; cursor: pointer; }
  .segment-item.active { background: #323236; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }

  /* Batch Pairs List */
  .pairs-scroll { flex: 1; overflow-y: auto; padding: 0 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  
  .batch-banner {
    background: rgba(10,132,255,0.12); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between;
    color: #0A84FF; font-size: 13px; font-weight: 600;
  }
  .batch-badge { background: #0A84FF; color: #fff; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 10px; }

  .pair-card {
    background: #1C1C1E; border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
  }
  .pair-card.matched { border: 1px solid rgba(10,132,255,0.3); }
  .pair-card.alert { border: 1px solid rgba(255,159,10,0.4); background: rgba(255,159,10,0.06); }

  .pair-thumbs-group { display: flex; align-items: center; gap: 8px; }
  .mini-cheki-thumb {
    width: 44px; height: 68px; background: #fff; border-radius: 4px; padding: 3px 3px 12px; display: flex; flex-direction: column;
    position: relative; box-shadow: 0 3px 8px rgba(0,0,0,0.5);
  }
  .thumb-inner { flex: 1; border-radius: 2px; }
  .thumb-tag { position: absolute; bottom: 2px; left: 0; right: 0; text-align: center; font-size: 7.5px; font-weight: 800; color: #333; }

  .pair-info-block { flex: 1; margin-left: 14px; }
  .pair-status-title { font-size: 14px; font-weight: 700; color: #fff; }
  .pair-status-title.blue { color: #0A84FF; }
  .pair-status-title.amber { color: #FF9F0A; }
  .pair-status-sub { font-size: 11.5px; color: rgba(235,235,245,0.6); margin-top: 2px; }

  /* Bottom Start Button */
  .bottom-action-sheet { padding: 14px 16px 28px; background: #000; border-top: 0.5px solid rgba(84,84,88,0.4); }
  .start-btn {
    background: #30D158; color: #000; font-size: 17px; font-weight: 700; border-radius: 16px; height: 52px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 16px rgba(48,209,88,0.3);
  }

  .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: #fff; border-radius: 3px; z-index: 100; }
</style>
</head>
<body>

<div class="iphone">
  <div class="sheet-header">
    <span class="sheet-btn-cancel">キャンセル</span>
    <span class="sheet-title">ペアリング確認</span>
    <span class="sheet-btn-done">完了</span>
  </div>

  <div class="segment-wrap">
    <div class="segment-pill-bg">
      <div class="segment-item">そのまま</div>
      <div class="segment-item active">⚡ 自動ペア</div>
      <div class="segment-item">手動ペア</div>
    </div>
  </div>

  <div class="pairs-scroll">
    <div class="batch-banner">
      <span>写真 16枚 を選択中 (枚数無制限)</span>
      <span class="batch-badge">順序ペアリング</span>
    </div>

    <!-- Pair 1 -->
    <div class="pair-card matched">
      <div class="pair-thumbs-group">
        <div class="mini-cheki-thumb">
          <div class="thumb-inner" style="background: linear-gradient(135deg, #4f46e5, #ec4899);"></div>
          <span class="thumb-tag">#1 表</span>
        </div>
        <span style="color:#0A84FF; font-weight:800; font-size:14px;">↔</span>
        <div class="mini-cheki-thumb">
          <div class="thumb-inner" style="background: #2a2a2a;"></div>
          <span class="thumb-tag">#2 裏</span>
        </div>
      </div>
      <div class="pair-info-block">
        <div class="pair-status-title blue">✓ 表裏ペア完了</div>
        <div class="pair-status-sub">2枚を1つのチェキとして結合</div>
      </div>
      <span style="color:rgba(235,235,245,0.4); font-size:18px; cursor:pointer;">✕</span>
    </div>

    <!-- Pair 2 (Alert: 2 Fronts) -->
    <div class="pair-card alert">
      <div class="pair-thumbs-group">
        <div class="mini-cheki-thumb">
          <div class="thumb-inner" style="background: linear-gradient(135deg, #059669, #10b981);"></div>
          <span class="thumb-tag">#3 表</span>
        </div>
        <span style="color:#FF9F0A; font-weight:800; font-size:14px;">⚠️</span>
        <div class="mini-cheki-thumb">
          <div class="thumb-inner" style="background: linear-gradient(135deg, #d97706, #f59e0b);"></div>
          <span class="thumb-tag">#4 表</span>
        </div>
      </div>
      <div class="pair-info-block">
        <div class="pair-status-title amber">⚠️ 2枚とも表面の可能性</div>
        <div class="pair-status-sub">AIが両方に被写体を検出</div>
      </div>
      <span style="color:#FF9F0A; font-size:13px; font-weight:700; cursor:pointer;">解除</span>
    </div>

    <!-- Pair 3 Single -->
    <div class="pair-card">
      <div class="pair-thumbs-group">
        <div class="mini-cheki-thumb">
          <div class="thumb-inner" style="background: linear-gradient(135deg, #6366f1, #8b5cf6);"></div>
          <span class="thumb-tag">#5 表</span>
        </div>
      </div>
      <div class="pair-info-block">
        <div class="pair-status-title">片面チェキ</div>
        <div class="pair-status-sub">裏面なしで保存</div>
      </div>
      <span style="color:#0A84FF; font-size:13px; font-weight:600; cursor:pointer;">＋ペア</span>
    </div>
  </div>

  <div class="bottom-action-sheet">
    <div class="start-btn">▶ 処理を開始する (16枚)</div>
  </div>

  <div class="home-indicator"></div>
</div>

</body>
</html>
