<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- 漸層定義 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primaryCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="amberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- 箭頭標記 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#818cf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>

    <!-- 卡片發光陰影 -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1600" height="1000" fill="url(#bgGradient)" />

  <!-- 頂部標題列 -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#accentGradient)" />
    <text x="13" y="27" fill="#ffffff" font-size="22" font-weight="900">C</text>
    <text x="56" y="22" fill="#ffffff" font-size="24" font-weight="800" letter-spacing="0.5">ChekiLens</text>
    <text x="195" y="22" fill="#94a3b8" font-size="14" font-weight="500">| 全架構使用者體驗與資料流向圖 (UI/UX Flowchart)</text>
    <text x="56" y="42" fill="#64748b" font-size="13" font-weight="400">iOS Native 100% On-Device Architecture • Ready for Figma Import</text>
  </g>

  <!-- 泳道 1: 首次啟動與新手導引 (Onboarding) -->
  <g transform="translate(60, 120)">
    <rect width="270" height="820" rx="16" fill="#131c31" stroke="#1e293b" stroke-width="1.5" />
    <rect width="270" height="48" rx="16" fill="#1e293b" />
    <path d="M 0 32 L 0 48 L 270 48 L 270 32 Z" fill="#1e293b" />
    <text x="20" y="30" fill="#38bdf8" font-size="15" font-weight="700">1. 初次使用導引 (Onboarding)</text>

    <!-- 步驟 1.1 -->
    <g transform="translate(18, 70)">
      <rect width="234" height="95" rx="10" fill="#1e293b" stroke="#334155" filter="url(#cardShadow)" />
      <text x="16" y="28" fill="#f8fafc" font-size="14" font-weight="700">首次啟動歡迎輪播</text>
      <text x="16" y="50" fill="#94a3b8" font-size="12">3 頁動態卡片輪播：</text>
      <text x="16" y="68" fill="#cbd5e1" font-size="11.5">• 自動拉直透視 • 日期 OCR</text>
      <text x="16" y="84" fill="#cbd5e1" font-size="11.5">• 正反雙面翻轉 • 特典會備忘</text>
    </g>

    <!-- 下箭頭 -->
    <line x1="135" y1="175" x2="135" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <!-- 步驟 1.2 -->
    <g transform="translate(18, 205)">
      <rect width="234" height="110" rx="10" fill="#1e293b" stroke="#334155" filter="url(#cardShadow)" />
      <text x="16" y="28" fill="#f8fafc" font-size="14" font-weight="700">權限請求與建構</text>
      <text x="16" y="52" fill="#94a3b8" font-size="12">• 相簿讀取/寫入權限 (Photos)</text>
      <text x="16" y="72" fill="#94a3b8" font-size="12">• 相機存取權限 (Camera)</text>
      <rect x="16" y="84" width="120" height="18" rx="4" fill="#0284c7" fill-opacity="0.3" />
      <text x="22" y="97" fill="#38bdf8" font-size="10.5" font-weight="600">自動建立 Cheki 相簿</text>
    </g>

    <!-- 下箭頭 -->
    <line x1="135" y1="325" x2="135" y2="345" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <!-- 步驟 1.3 -->
    <g transform="translate(18, 355)">
      <rect width="234" height="160" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)" />
      <text x="16" y="28" fill="#38bdf8" font-size="14" font-weight="700">典藏首頁 (首次空狀態)</text>
      <text x="16" y="50" fill="#94a3b8" font-size="12">情境式新手提示 (Coach Marks):</text>
      <rect x="14" y="60" width="206" height="42" rx="6" fill="#0f172a" />
      <text x="22" y="77" fill="#f1f5f9" font-size="11" font-weight="600">「💡 建立第一個團體與成員」</text>
      <text x="22" y="93" fill="#94a3b8" font-size="10.5">點擊下方按鈕開始翻拍</text>

      <rect x="14" y="112" width="206" height="34" rx="8" fill="url(#accentGradient)" />
      <text x="65" y="133" fill="#ffffff" font-size="12.5" font-weight="700">＋ 翻拍第一張拍立得</text>
    </g>

    <!-- 步驟 1.4: 浮動操作引導 -->
    <g transform="translate(18, 555)">
      <rect width="234" height="235" rx="10" fill="#0f172a" stroke="#334155" stroke-dasharray="4" />
      <text x="16" y="28" fill="#cbd5e1" font-size="13" font-weight="700">新手互動手勢指引</text>
      <text x="16" y="55" fill="#94a3b8" font-size="11.5">首次開啟單張檢視時觸發：</text>
      
      <circle cx="32" cy="85" r="14" fill="#334155" />
      <text x="27" y="90" fill="#38bdf8" font-size="12">👆</text>
      <text x="56" y="82" fill="#f8fafc" font-size="12" font-weight="600">輕點卡片</text>
      <text x="56" y="98" fill="#64748b" font-size="11">3D 翻轉查看背面手寫筆跡</text>

      <circle cx="32" cy="135" r="14" fill="#334155" />
      <text x="27" y="140" fill="#38bdf8" font-size="12">⬆️</text>
      <text x="56" y="132" fill="#f8fafc" font-size="12" font-weight="600">向上滑動 (Swipe Up)</text>
      <text x="56" y="148" fill="#64748b" font-size="11">滑出特典會備忘錄與 #標籤</text>

      <circle cx="32" cy="185" r="14" fill="#334155" />
      <text x="27" y="190" fill="#38bdf8" font-size="12">🔍</text>
      <text x="56" y="182" fill="#f8fafc" font-size="12" font-weight="600">按住角落</text>
      <text x="56" y="198" fill="#64748b" font-size="11">浮現放大鏡進行微米級微調</text>
    </g>
  </g>

  <!-- 泳道 2: 批次匯入與配對工作台 (Import & Workbench) -->
  <g transform="translate(360, 120)">
    <rect width="280" height="820" rx="16" fill="#131c31" stroke="#1e293b" stroke-width="1.5" />
    <rect width="280" height="48" rx="16" fill="#1e293b" />
    <path d="M 0 32 L 0 48 L 280 48 L 280 32 Z" fill="#1e293b" />
    <text x="20" y="30" fill="#818cf8" font-size="15" font-weight="700">2. 批次匯入與配對工作台</text>

    <!-- 步驟 2.1 -->
    <g transform="translate(20, 70)">
      <rect width="240" height="85" rx="10" fill="#1e293b" stroke="#334155" filter="url(#cardShadow)" />
      <text x="16" y="28" fill="#f8fafc" font-size="14" font-weight="700">相簿多選 (PhotosPicker)</text>
      <text x="16" y="50" fill="#94a3b8" font-size="12">支援從原生相簿選取 1~50 張</text>
      <text x="16" y="68" fill="#64748b" font-size="11">（包含單面拍立得與混合正反面）</text>
    </g>

    <!-- 下箭頭 -->
    <line x1="140" y1="165" x2="140" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <!-- 步驟 2.2: 配對確認工作台 -->
    <g transform="translate(20, 195)">
      <rect width="240" height="295" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" filter="url(#cardShadow)" />
      <text x="16" y="28" fill="#818cf8" font-size="14" font-weight="700">配對確認工作台 (Workbench)</text>
      <text x="16" y="48" fill="#94a3b8" font-size="11.5">依據真實情況提供三種模式：</text>

      <!-- 模式 A -->
      <rect x="14" y="60" width="212" height="60" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="24" y="80" fill="#f8fafc" font-size="12" font-weight="700">【A. 直接執行】</text>
      <text x="24" y="98" fill="#94a3b8" font-size="11">全數當作獨立單面卡片匯入</text>

      <!-- 模式 B -->
      <rect x="14" y="130" width="212" height="75" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" />
      <text x="24" y="150" fill="#818cf8" font-size="12" font-weight="700">【B. 自動配對 (順序+驗證)】</text>
      <text x="24" y="168" fill="#cbd5e1" font-size="11">按順序 1-2, 3-4 成對綁定</text>
      <text x="24" y="186" fill="#38bdf8" font-size="10.5">⚡ Vision 檢驗防呆：連兩張正面警示</text>

      <!-- 模式 C -->
      <rect x="14" y="215" width="212" height="65" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="24" y="235" fill="#f8fafc" font-size="12" font-weight="700">【C. 手動配對 (循環手勢)】</text>
      <text x="24" y="253" fill="#94a3b8" font-size="11">點擊 [正面] ➔ 點擊 [反面] 綁定</text>
      <text x="24" y="269" fill="#64748b" font-size="10">適合僅少數有寫背面的混合批次</text>
    </g>

    <!-- 下箭頭 -->
    <line x1="140" y1="500" x2="140" y2="520" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <!-- 步驟 2.3 -->
    <g transform="translate(20, 530)">
      <rect width="240" height="95" rx="10" fill="#1e293b" stroke="#334155" filter="url(#cardShadow)" />
      <text x="16" y="28" fill="#f8fafc" font-size="14" font-weight="700">批次佇列背景處理</text>
      <text x="16" y="52" fill="#94a3b8" font-size="12">• 背景並行處理拉直與透視</text>
      <text x="16" y="72" fill="#94a3b8" font-size="12">• 圓形進度條與完成觸覺震動</text>
    </g>

    <!-- 橫向連接箭頭往第三泳道 -->
    <path d="M 260 577 L 310 577 L 310 240 L 330 240" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow-accent)" />
  </g>

  <!-- 泳道 3: 原生演算法處理核心 (Vision & Deskew Pipeline) -->
  <g transform="translate(670, 120)">
    <rect width="270" height="820" rx="16" fill="#131c31" stroke="#1e293b" stroke-width="1.5" />
    <rect width="270" height="48" rx="16" fill="#1e293b" />
    <path d="M 0 32 L 0 48 L 270 48 L 270 32 Z" fill="#1e293b" />
    <text x="20" y="30" fill="#34d399" font-size="15" font-weight="700">3. 影像核心運算管線</text>

    <!-- 步驟 3.1 -->
    <g transform="translate(18, 70)">
      <rect width="234" height="115" rx="10" fill="#1e293b" stroke="#059669" stroke-width="1.2" filter="url(#cardShadow)" />
      <text x="16" y="28" fill="#34d399" font-size="14" font-weight="700">多層邊框偵測 (Fallback)</text>
      <text x="16" y="52" fill="#f8fafc" font-size="12">1. Apple Vision 矩形偵測</text>
      <text x="16" y="72" fill="#94a3b8" font-size="12">2. Hough 直線交點擬合</text>
      <text x="16" y="92" fill="#94a3b8" font-size="12">3. HSV 白色邊框色相分割</text>
    </g>

    <!-- 下箭頭 -->
    <line x1="135" y1="195" x2="135" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <!-- 步驟 3.2 -->
    <g transform="translate(18, 225)">
      <rect width="234" height="100" rx="10" fill="#1e293b" stroke="#334155" filter="url(#cardShadow)" />
      <text x="16" y="28" fill="#f8fafc" font-size="14" font-weight="700">實體比例透視校正</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11.5">• 鎖定 86×54mm (Mini) 等比</text>
      <text x="16" y="68" fill="#cbd5e1" font-size="11.5">• CIPerspectiveCorrection 高清重採樣</text>
      <text x="16" y="86" fill="#34d399" font-size="11.5">• 支援邊界微調偏移 (Inset/Outset)</text>
    </g>

    <!-- 下箭頭 -->
    <line x1="135" y1="335" x2="135" y2="355" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <!-- 步驟 3.3: OCR 核心 -->
    <g transform="translate(18, 365)">
      <rect width="234" height="130" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)" />
      <text x="16" y="28" fill="#34d399" font-size="14" font-weight="700">底部手寫日期 OCR</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11.5">VNRecognizeTextRequest:</text>
      <rect x="14" y="60" width="206" height="32" rx="4" fill="#0f172a" />
      <text x="22" y="80" fill="#34d399" font-family="monospace" font-size="12">「2024.9.24」➔ Date()</text>
      <text x="16" y="110" fill="#cbd5e1" font-size="11">自動修正拍攝時間戳 (EXIF)</text>
    </g>

    <!-- 下箭頭 -->
    <line x1="135" y1="505" x2="135" y2="525" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <!-- 步驟 3.4: 反光處理機制 -->
    <g transform="translate(18, 535)">
      <rect width="234" height="115" rx="10" fill="#1e293b" stroke="#334155" filter="url(#cardShadow)" />
      <text x="16" y="28" fill="#f8fafc" font-size="14" font-weight="700">反光雙模式 (Anti-Glare)</text>
      <text x="16" y="52" fill="#cbd5e1" font-size="11.5">• 預設 Mode A：單張提示+濾鏡修復</text>
      <text x="16" y="74" fill="#cbd5e1" font-size="11.5">• 可選 Mode B：雙角度拍照合成</text>
      <text x="16" y="96" fill="#64748b" font-size="10.5">特徵點配準融合消除光斑</text>
    </g>
  </g>

  <!-- 泳道 4: 單張檢視與上滑備忘 (Detail View & Memo) -->
  <g transform="translate(970, 120)">
    <rect width="280" height="820" rx="16" fill="#131c31" stroke="#1e293b" stroke-width="1.5" />
    <rect width="280" height="48" rx="16" fill="#1e293b" />
    <path d="M 0 32 L 0 48 L 280 48 L 280 32 Z" fill="#1e293b" />
    <text x="20" y="30" fill="#f59e0b" font-size="15" font-weight="700">4. 單張檢視與備忘互動</text>

    <!-- 步驟 4.1 -->
    <g transform="translate(20, 70)">
      <rect width="240" height="175" rx="10" fill="#1e293b" stroke="#334155" filter="url(#cardShadow)" />
      <text x="16" y="28" fill="#f8fafc" font-size="14" font-weight="700">全螢幕典藏檢視 (Detail)</text>
      <text x="16" y="50" fill="#94a3b8" font-size="12">直覺觸控交互：</text>

      <rect x="14" y="62" width="212" height="45" rx="6" fill="#0f172a" />
      <text x="22" y="82" fill="#f59e0b" font-size="11.5" font-weight="600">🔄 雙擊 / 點擊翻轉</text>
      <text x="22" y="98" fill="#cbd5e1" font-size="10.5">3D 沿 Y 軸 180° 翻轉至背面</text>

      <rect x="14" y="115" width="212" height="45" rx="6" fill="#0f172a" />
      <text x="22" y="135" fill="#f59e0b" font-size="11.5" font-weight="600">⬆️ 手指向上滑動 (Swipe Up)</text>
      <text x="22" y="150" fill="#cbd5e1" font-size="10.5">呼出原生相片資訊 Info Sheet</text>
    </g>

    <!-- 下箭頭 -->
    <line x1="140" y1="255" x2="140" y2="275" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <!-- 步驟 4.2: 上滑面板展示 -->
    <g transform="translate(20, 285)">
      <rect width="240" height="235" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#cardShadow)" />
      <text x="16" y="28" fill="#f59e0b" font-size="14" font-weight="700">原生 Info Sheet (上滑展開)</text>
      <text x="16" y="48" fill="#94a3b8" font-size="11">圖片等比縮小上移，下方展開面板：</text>

      <!-- 無備忘狀態 -->
      <rect x="12" y="58" width="216" height="75" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="20" y="78" fill="#f8fafc" font-size="11.5" font-weight="600">【無備忘狀態】</text>
      <text x="20" y="96" fill="#94a3b8" font-size="11">• 點擊「新增備忘」</text>
      <text x="20" y="116" fill="#cbd5e1" font-size="10.5">喚起原生鍵盤：輸入對話與 #標籤</text>

      <!-- 已有備忘狀態 -->
      <rect x="12" y="142" width="216" height="80" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <text x="20" y="162" fill="#f59e0b" font-size="11.5" font-weight="600">【已有備忘狀態】</text>
      <text x="20" y="180" fill="#cbd5e1" font-size="11">📅 2024.09.24 (OCR)</text>
      <text x="20" y="198" fill="#38bdf8" font-size="11">🏷️ #生誕祭 #浴衣</text>
      <text x="20" y="214" fill="#94a3b8" font-size="10.5">💬「今天也辛苦了，謝謝你來看我」</text>
    </g>

    <!-- 步驟 4.3: 邊界偏移滑桿 -->
    <g transform="translate(20, 540)">
      <rect width="240" height="110" rx="10" fill="#1e293b" stroke="#334155" filter="url(#cardShadow)" />
      <text x="16" y="28" fill="#f8fafc" font-size="14" font-weight="700">邊界偏移微調 (Inset/Outset)</text>
      <text x="16" y="52" fill="#94a3b8" font-size="11.5">即時滑桿調節 (-3% ~ +3%)：</text>
      <text x="16" y="74" fill="#cbd5e1" font-size="11">• 往外偏移：100% 完整保留物理邊界</text>
      <text x="16" y="94" fill="#cbd5e1" font-size="11">• 往內收窄：去除背景雜色還原卡片</text>
    </g>
  </g>

  <!-- 泳道 5: 系統相簿雙向同步 (Photos Sync) -->
  <g transform="translate(1280, 120)">
    <rect width="260" height="820" rx="16" fill="#131c31" stroke="#1e293b" stroke-width="1.5" />
    <rect width="260" height="48" rx="16" fill="#1e293b" />
    <path d="M 0 32 L 0 48 L 260 48 L 260 32 Z" fill="#1e293b" />
    <text x="20" y="30" fill="#ec4899" font-size="15" font-weight="700">5. 系統相簿雙向同步 (B模式)</text>

    <!-- 步驟 5.1 -->
    <g transform="translate(18, 70)">
      <rect width="224" height="135" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" filter="url(#cardShadow)" />
      <text x="16" y="28" fill="#ec4899" font-size="14" font-weight="700">iOS 原生相簿結構建構</text>
      <text x="16" y="52" fill="#f8fafc" font-size="12">Photos.app 目錄階層：</text>
      <rect x="14" y="60" width="196" height="60" rx="6" fill="#0f172a" />
      <text x="22" y="80" fill="#ec4899" font-size="11.5">📁 ChekiLens</text>
